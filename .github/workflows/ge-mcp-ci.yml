name: Gemini Enterprise MCP Security & Smoke CI

on:
  push:
    branches: ["main"]
    paths:
      - "projects/**"
      - ".github/workflows/ge-mcp-ci.yml"
  pull_request:
    paths:
      - "projects/**"
      - ".github/workflows/ge-mcp-ci.yml"

permissions:
  contents: read

jobs:
  repo-security-and-hygiene-gate:
    name: Repo Secret, Container & External Hygiene Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run deterministic secret, Dockerfile non-root, and hygiene scan
        run: |
          python3 - << 'EOF'
          import re, subprocess, sys
          from pathlib import Path

          proc = subprocess.run(["git", "ls-files", "projects/"], capture_output=True, text=True, check=True)
          files = [Path(f.strip()) for f in proc.stdout.splitlines() if f.strip()]
          SKIP_EXTS = {".png", ".jpg", ".jpeg", ".gif", ".ico", ".webp", ".pdf", ".zip", ".tar", ".gz", ".mp3", ".mp4", ".woff", ".woff2", ".ttf", ".pyc", ".pack", ".idx", ".lock"}

          SECRET_PATTERNS = [
              ("GCP API Key", re.compile(r"(?<![A-Za-z0-9_-])AIza[0-9A-Za-z_-]{35}(?![A-Za-z0-9_-])")),
              ("OAuth Access Token", re.compile(r"(?<![A-Za-z0-9_-])ya29\.[0-9A-Za-z_-]{20,}")),
              ("Google OAuth Client Secret", re.compile(r"(?<![A-Za-z0-9_-])GOCSPX-[0-9A-Za-z_-]{20,}")),
              ("Private Key Block", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----")),
              ("OpenAI / Anthropic Key", re.compile(r"(?<![A-Za-z0-9_-])sk-(?:proj-[A-Za-z0-9_-]{20,}|svcacct-[A-Za-z0-9_-]{20,}|ant-[A-Za-z0-9_-]{20,}|(?=[A-Za-z0-9]{32,}\b)(?=[A-Za-z0-9]*[A-Z])(?=[A-Za-z0-9]*\d)[A-Za-z0-9]{32,})(?![A-Za-z0-9_-])")),
              ("GitHub Token", re.compile(r"(?<![A-Za-z0-9_-])gh[pousr]_[0-9A-Za-z]{30,}(?![A-Za-z0-9_-])")),
              ("Committed .env file", re.compile(r"(?:^|/)\.env$")),
          ]

          failures = []
          for p in files:
              if re.search(r"(?:^|/)\.env$", str(p)):
                  failures.append(f"[SECRET_FILE] Committed .env file detected: {p}")
              if not p.exists() or p.suffix.lower() in SKIP_EXTS:
                  continue
              text = p.read_text(encoding="utf-8", errors="replace")
              lines = text.splitlines()
              if p.name == "Dockerfile" or p.name.startswith("Dockerfile."):
                  if not any(re.match(r"^\s*USER\s+(?!(?:root|0)(?:\b|:))\S+", l) for l in lines):
                      failures.append(f"[DOCKER_ROOT] {p} is missing a non-root USER instruction")
              for idx, line in enumerate(lines, 1):
                  for label, pat in SECRET_PATTERNS[:-1]:
                      if pat.search(line):
                          failures.append(f"[SECRET] {p}:{idx} matched {label}")

          if failures:
              for f in failures:
                  print(f"ERROR: {f}")
              sys.exit(1)
          print(f"Scanned {len(files)} tracked files in projects/: 0 secrets, 0 root Dockerfiles.")
          EOF

      - name: Run Smart Router Security & Unit Test Suite
        working-directory: projects/ge-smart-router
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 test_router.py

  verify-mcp-servers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ge_mcp/claude_mcp_sonnet
          - ge_mcp/customize_outlook_mcp
          - ge_mcp/sharepoint-mcp-server
          - ge_mcp/customize-sharepoint-mcp-server
          - ge_mcp/least-privilege-sharepoint-mcp-server
          - ge_mcp/sharepoint-mcp-server-purview-label
          - ge_mcp/sharepoint-mcp-server-purview-sdp
          - ge_mcp_v2/claude_mcp_sonnet
          - ge_mcp_v2/customize_outlook_mcp
          - ge_mcp_v2/sharepoint-mcp-server
          - ge_mcp_v2/customize-sharepoint-mcp-server
          - ge_mcp_v2/least-privilege-sharepoint-mcp-server
          - ge_mcp_v2/sharepoint-mcp-server-purview-label
          - ge_mcp_v2/sharepoint-mcp-server-purview-sdp
    defaults:
      run:
        working-directory: projects/${{ matrix.service }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: projects/${{ matrix.service }}/package-lock.json

      - name: Install production dependencies & audit advisories
        run: |
          npm ci
          npm audit --omit=dev --audit-level=moderate

      - name: Syntax check scripts & run loopback smoke tests
        run: |
          for f in *.sh; do [ -f "$f" ] && bash -n "$f"; done
          chmod +x test_local.sh
          ./test_local.sh

  verify-workiq-purview-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pydir:
          - projects/ge_mcp/workiq-mcp-purview
          - projects/ge_mcp_v2/workiq-mcp-purview
    defaults:
      run:
        working-directory: ${{ matrix.pydir }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies & compile check
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m py_compile *.py
          if [ -f test_local.sh ]; then chmod +x test_local.sh && ./test_local.sh; fi
