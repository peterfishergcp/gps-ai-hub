<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skills</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/preload.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z" fill="rgba(37,99,235,0.14)"/>
          <path d="M5 3v4M3 5h4M19 17v4M17 19h4"/>
        </svg>
        <div>
          <div class="brand-title" id="header-title">Skills</div>
          <div class="brand-sub" id="header-sub">Loading suite &amp; personal skills...</div>
        </div>
      </div>
      <div class="topbar-actions" id="topbar-actions">
        <button class="btn btn-sm" id="btn-new-skill" type="button">+ New Skill</button>
        <button class="btn btn-secondary btn-sm" id="btn-ge-hub" type="button">GE Connector Hub</button>
        <button class="btn btn-secondary btn-sm" id="btn-sync-updates" type="button" title="Incrementally sync latest suite skills via SHA-256">Sync Updates</button>
        <button class="btn btn-secondary btn-sm" id="btn-refresh" type="button">Refresh</button>
      </div>
    </header>

    <main class="content" id="view-root"></main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/token_pill_ui.js"></script>
  <script src="/app.js"></script>
</body>
</html>
