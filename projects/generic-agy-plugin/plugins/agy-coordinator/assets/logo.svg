<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <radialGradient id="furMain" cx="44%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#B87A44"/>
      <stop offset="52%" stop-color="#8B5A2B"/>
      <stop offset="100%" stop-color="#5C3818"/>
    </radialGradient>
    <radialGradient id="furBody" cx="46%" cy="36%" r="60%">
      <stop offset="0%" stop-color="#A66B38"/>
      <stop offset="58%" stop-color="#7C4D23"/>
      <stop offset="100%" stop-color="#523114"/>
    </radialGradient>
    <radialGradient id="earInner" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FCE3C5"/>
      <stop offset="100%" stop-color="#DFAB78"/>
    </radialGradient>
    <radialGradient id="muzzle" cx="50%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#FFF0DB"/>
      <stop offset="70%" stop-color="#F2CCA0"/>
      <stop offset="100%" stop-color="#DFB180"/>
    </radialGradient>
    <linearGradient id="wvBandana" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B4A7D"/>
      <stop offset="100%" stop-color="#053254"/>
    </linearGradient>
    <radialGradient id="wvBadge" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="65%" stop-color="#D5A245"/>
      <stop offset="100%" stop-color="#9A6B16"/>
    </radialGradient>
  </defs>

  <!-- Cute chubby brown bear body & arms -->
  <ellipse cx="64" cy="186" rx="22" ry="30" transform="rotate(22 64 186)" fill="url(#furBody)"/>
  <ellipse cx="192" cy="186" rx="22" ry="30" transform="rotate(-22 192 186)" fill="url(#furBody)"/>
  <ellipse cx="128" cy="194" rx="58" ry="50" fill="url(#furBody)"/>
  <ellipse cx="128" cy="202" rx="34" ry="29" fill="url(#muzzle)" opacity="0.92"/>

  <!-- Round Brown Bear ears -->
  <circle cx="66" cy="64" r="30" fill="url(#furMain)"/>
  <circle cx="190" cy="64" r="30" fill="url(#furMain)"/>
  <circle cx="66" cy="66" r="16" fill="url(#earInner)"/>
  <circle cx="190" cy="66" r="16" fill="url(#earInner)"/>

  <!-- 3D Brown Bear Head -->
  <ellipse cx="128" cy="116" rx="76" ry="68" fill="url(#furMain)"/>
  <path d="M72 72C92 54 164 54 184 72" stroke="#FFF7ED" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round"/>

  <!-- Warm rosy cheeks -->
  <ellipse cx="78" cy="132" rx="13" ry="8" fill="#FB7185" fill-opacity="0.42"/>
  <ellipse cx="178" cy="132" rx="13" ry="8" fill="#FB7185" fill-opacity="0.42"/>

  <!-- Cream-Tan Muzzle -->
  <ellipse cx="128" cy="136" rx="35" ry="27" fill="url(#muzzle)"/>

  <!-- Glossy 3D Eyes -->
  <circle cx="96" cy="106" r="12.5" fill="#1E140C"/>
  <circle cx="160" cy="106" r="12.5" fill="#1E140C"/>
  <circle cx="92.5" cy="101.5" r="4.3" fill="#FFFFFF"/>
  <circle cx="156.5" cy="101.5" r="4.3" fill="#FFFFFF"/>
  <circle cx="99.5" cy="109.5" r="2.0" fill="#FFFFFF" fill-opacity="0.72"/>
  <circle cx="163.5" cy="109.5" r="2.0" fill="#FFFFFF" fill-opacity="0.72"/>

  <!-- Friendly Eyebrows -->
  <path d="M84 86C89 82 99 82 104 85" stroke="#4A2C11" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M152 85C157 82 167 82 172 86" stroke="#4A2C11" stroke-width="3.8" stroke-linecap="round"/>

  <!-- Glossy Bear Nose -->
  <ellipse cx="128" cy="124" rx="13.5" ry="9.5" fill="#29170B"/>
  <ellipse cx="124" cy="121.5" rx="4.8" ry="2.4" fill="#FFFFFF" fill-opacity="0.45"/>

  <!-- Happy Smile aligned with lip-sync seam -->
  <path d="M128 133V143" stroke="#3F1D0B" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M113 144C118 151 138 151 143 144" stroke="#3F1D0B" stroke-width="3.8" stroke-linecap="round"/>

  <!-- West Virginia Navy & Mountain Gold Bandana Collar -->
  <path d="M74 166C96 180 160 180 182 166L168 192L128 206L88 192Z" fill="url(#wvBandana)"/>
  <path d="M82 170C102 181 154 181 174 170" stroke="#D5A245" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="128" cy="189" r="10.5" fill="url(#wvBadge)" stroke="#053254" stroke-width="2"/>
</svg>
