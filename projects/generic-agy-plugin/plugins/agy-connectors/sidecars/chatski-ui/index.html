<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatski</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/preload.js"></script>
</head>
<body>
  <div class="chatski-shell">
    <!-- LEFT SIDEBAR: Search, Filters, DMs, Spaces -->
    <aside class="left-rail" aria-label="Chat conversations">
      <div class="rail-brand-row">
        <div class="rail-brand">
          <span class="chatski-glyph" aria-hidden="true">💬</span>
          <span class="rail-brand-name">Chatski</span>
          <span class="mode-badge" id="mode-badge">GE Chat</span>
        </div>
        <div class="rail-top-icons">
          <button type="button" class="rail-icon-btn" id="btn-theme" title="Toggle Dark / Light theme" aria-label="Toggle theme">☀</button>
          <button type="button" class="rail-icon-btn" id="btn-settings" title="Gemini Enterprise &amp; Direct Chat Settings" aria-label="Settings">⚙</button>
        </div>
      </div>

      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input
          type="search"
          id="chat-search-input"
          class="chat-search-input"
          placeholder="Search chats"
          aria-label="Search chats"
        />
        <kbd class="search-kbd">Ctrl K</kbd>
      </div>

      <div class="filter-pills" id="filter-pills" role="tablist">
        <button type="button" class="filter-pill active" data-filter="all">All</button>
        <button type="button" class="filter-pill" data-filter="unread" id="pill-unread">Unread</button>
        <button type="button" class="filter-pill" data-filter="mentions">Mentions</button>
        <button type="button" class="filter-pill" data-filter="drafts" id="pill-drafts">Drafts</button>
      </div>

      <div class="rail-lists" id="rail-lists"></div>

      <div class="rail-footer">
        <span class="rail-status-text" id="rail-status-text">Recent chats · ready</span>
        <button type="button" class="sync-mini-btn" id="btn-sync-ge" title="Sync conversations from Gemini Enterprise Chat Connector">↻ Sync</button>
      </div>
    </aside>

    <!-- RIGHT PANE: Header, Message Stream, Confirm Bar, Composer -->
    <section class="chat-pane" aria-label="Active conversation">
      <header class="chat-header">
        <div class="chat-header-left" id="chat-header-left"></div>
        <div class="chat-header-actions" id="chat-header-actions">
          <span id="token-anchor"></span>
          <button type="button" class="hdr-btn" id="btn-summarize-space" title="Summarize this Space or DM in Antigravity">✨ Summarize</button>
          <button type="button" class="hdr-btn" id="btn-refresh-thread" title="Refresh messages in this conversation">↻</button>
          <a class="hdr-btn" id="link-open-external" href="https://mail.google.com/chat/u/0/#chat/home" target="_blank" rel="noopener noreferrer" title="Open in Google Chat Web">↗</a>
        </div>
      </header>

      <div class="connection-banner hidden" id="connection-banner"></div>

      <div class="messages-viewport" id="messages-viewport"></div>

      <button type="button" class="jump-latest-btn hidden" id="btn-jump-latest">↓ Jump to latest</button>

      <div class="confirm-bar hidden" id="confirm-bar"></div>
      <div class="reply-quote-bar hidden" id="reply-quote-bar"></div>

      <footer class="composer-wrap">
        <div class="composer-box">
          <span class="composer-sparkle" aria-hidden="true">✨</span>
          <textarea
            id="composer-input"
            class="composer-input"
            rows="1"
            placeholder="Write a message, or ask Antigravity to draft one"
            aria-label="Write a message or ask Antigravity to draft one"
          ></textarea>
          <div class="composer-actions">
            <button type="button" class="comp-btn" id="btn-stage-draft" title="Save to Chatski Drafts without sending">Save Draft</button>
            <button type="button" class="comp-btn comp-btn-ai" id="btn-ai-draft" title="Ask Antigravity (/my-voice) to draft a reply in your voice">✨ Draft</button>
            <button type="button" class="comp-send-btn" id="btn-send-msg" title="Review &amp; Send message" aria-label="Send message">➤</button>
          </div>
        </div>
      </footer>
    </section>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-backdrop hidden" id="settings-modal">
    <div class="modal-card" id="settings-card"></div>
  </div>

  <div class="toast hidden" id="chatski-toast"></div>

  <script src="/token_pill_ui.js"></script>
  <script src="/app.js"></script>
</body>
</html>
