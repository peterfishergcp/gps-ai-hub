<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 800" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gcpCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="mcpCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="msftCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.88"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c084fc"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1380" height="800" rx="16" fill="url(#bgGrad)"/>

  <!-- Header Banner -->
  <text x="690" y="44" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="700">
    Gemini Enterprise Native Connector SDP Policy  ↔  SharePoint Purview-Label MCP  ↔  Microsoft 365
  </text>
  <text x="690" y="70" text-anchor="middle" fill="#94a3b8" font-size="13.5">
    Reference Architecture: Extracting Microsoft Purview (MIP) Sensitivity Labels for Native Connector-Level Google Cloud SDP Enforcement
  </text>

  <!-- ==================== COLUMN 1: GEMINI ENTERPRISE & NATIVE SDP POLICY ==================== -->
  <rect x="28" y="96" width="415" height="670" rx="14" fill="url(#gcpCard)" stroke="#3b82f6" stroke-width="2"/>
  <text x="235" y="128" text-anchor="middle" fill="#60a5fa" font-size="16.5" font-weight="700">
    1. Gemini Enterprise &amp; Native SDP Policy
  </text>
  <text x="235" y="148" text-anchor="middle" fill="#93c5fd" font-size="12">
    Connector-Level Content Policy &amp; Cloud DLP Inspection
  </text>

  <!-- Enterprise User + Agent -->
  <rect x="48" y="168" width="375" height="82" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="235" y="194" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">👤 Enterprise User &amp; Gemini Enterprise Root Agent</text>
  <text x="235" y="214" text-anchor="middle" fill="#cbd5e1" font-size="12">Prompts for SharePoint files by name or topic</text>
  <text x="235" y="233" text-anchor="middle" fill="#94a3b8" font-size="11">Invokes Custom MCP Connector Tools (StreamRunAgent)</text>

  <!-- Native SDP Policy Engine Box -->
  <rect x="48" y="270" width="375" height="295" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="235" y="296" text-anchor="middle" fill="#fbbf24" font-size="14.5" font-weight="700">🛡️ Connector-Level SDP Content Policy</text>
  <text x="235" y="316" text-anchor="middle" fill="#fde68a" font-size="11.5">Attached directly to Gemini Enterprise Custom MCP Connector</text>

  <!-- MSIP Label Parser Sub-box -->
  <rect x="64" y="330" width="343" height="106" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="235" y="350" text-anchor="middle" fill="#38bdf8" font-size="12.5" font-weight="700">A. Native MSIP Label Extraction (DolphinService)</text>
  <text x="78" y="370" fill="#e2e8f0" font-size="11">• Parses tool JSON for recognized MSIP keys:</text>
  <text x="90" y="388" fill="#34d399" font-size="11" font-family="monospace">msip_labels | assigned_labels | assigned_sensitivity_labels</text>
  <text x="78" y="406" fill="#e2e8f0" font-size="11">• Builds Cloud DLP proto payload:</text>
  <text x="90" y="424" fill="#93c5fd" font-size="10.8" font-family="monospace">FileLabel.SensitivityLabelMetadata(guid="&lt;label-guid&gt;")</text>

  <!-- Content + Verdict Sub-box -->
  <rect x="64" y="446" width="343" height="104" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="235" y="466" text-anchor="middle" fill="#38bdf8" font-size="12.5" font-weight="700">B. Cloud SDP Inspection Template Evaluation</text>
  <text x="78" y="486" fill="#e2e8f0" font-size="11">• Evaluates extracted text against Custom/Built-in InfoTypes (Regex)</text>
  <text x="78" y="504" fill="#e2e8f0" font-size="11">• Evaluates extracted Purview GUID against SensitivityLabel InfoTypes</text>
  <text x="78" y="524" fill="#34d399" font-size="11.5" font-weight="700">✓ ALLOW: Returns content + #page=X citations to LLM</text>
  <text x="78" y="541" fill="#f87171" font-size="11.5" font-weight="700">✗ BLOCK: Redacts tool response before reaching LLM</text>

  <!-- BigQuery Audit Logging Box -->
  <rect x="48" y="585" width="375" height="158" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="235" y="612" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="700">📊 Cloud SDP &amp; BigQuery Audit Logging</text>
  <text x="68" y="636" fill="#e2e8f0" font-size="11.5">• Logs every connector tool inspection to BigQuery:</text>
  <text x="80" y="656" fill="#cbd5e1" font-size="11" font-family="monospace">- matched_info_types (e.g. CUSTOM_LABEL, REGEX_RULE)</text>
  <text x="80" y="674" fill="#cbd5e1" font-size="11" font-family="monospace">- policy_action (ALLOW / BLOCK)</text>
  <text x="80" y="692" fill="#cbd5e1" font-size="11" font-family="monospace">- connector_id &amp; tool_name</text>
  <text x="68" y="718" fill="#94a3b8" font-size="11">• Zero DLP API calls or GCP credentials required inside MCP server</text>

  <!-- ==================== COLUMN 2: SHAREPOINT PURVIEW-LABEL MCP SERVER ==================== -->
  <rect x="482" y="96" width="415" height="670" rx="14" fill="url(#mcpCard)" stroke="#10b981" stroke-width="2"/>
  <text x="690" y="128" text-anchor="middle" fill="#34d399" font-size="16.5" font-weight="700">
    2. SharePoint Purview-Label MCP (Cloud Run)
  </text>
  <text x="690" y="148" text-anchor="middle" fill="#6ee7b7" font-size="12">
    Stateless Metadata &amp; OOXML Label Extractor (No Internal DLP Calls)
  </text>

  <!-- MCP Server & Resolver Box -->
  <rect x="502" y="168" width="375" height="115" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="690" y="194" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">⚡ Streamable HTTP MCP Server (/mcp)</text>
  <text x="520" y="216" fill="#e2e8f0" font-size="11.5">• 12 Read/Write SharePoint Tools + Citation Instructions</text>
  <text x="520" y="236" fill="#e2e8f0" font-size="11.5">• Smart Drive &amp; Filename Resolver (resolveDriveAndItem):</text>
  <text x="532" y="254" fill="#cbd5e1" font-size="11">Translates human filenames ("Report.docx") to Graph Item IDs</text>
  <text x="532" y="270" fill="#cbd5e1" font-size="11">across tenant drives to prevent Graph HTTP 400 errors</text>

  <!-- 3-Tier Purview Extraction Engine -->
  <rect x="502" y="302" width="375" height="240" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="690" y="328" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700">🔍 3-Tier Purview Sensitivity Label Extractor</text>

  <rect x="518" y="342" width="343" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="530" y="361" fill="#38bdf8" font-size="11.5" font-weight="700">Tier 1: Microsoft Graph Beta sensitivityLabel Facet</text>
  <text x="530" y="380" fill="#cbd5e1" font-size="10.8" font-family="monospace">GET /beta/drives/{id}/items/{id} → sensitivityLabel.id</text>

  <rect x="518" y="402" width="343" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="530" y="421" fill="#c084fc" font-size="11.5" font-weight="700">Tier 2: SharePoint ListItem Extended Fields</text>
  <text x="530" y="440" fill="#cbd5e1" font-size="10.8" font-family="monospace">$expand=listItem($expand=fields) → _SensitivityLabelId</text>

  <rect x="518" y="462" width="343" height="66" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <text x="530" y="481" fill="#34d399" font-size="11.5" font-weight="700">Tier 3: OOXML ZIP docProps/custom.xml Decompression</text>
  <text x="530" y="499" fill="#e2e8f0" font-size="10.8">Inflates Deflate-compressed custom.xml in .docx/.xlsx/.pptx:</text>
  <text x="530" y="516" fill="#fbbf24" font-size="10.5" font-family="monospace">MSIP_Label_&lt;GUID&gt;_Enabled=true | MSIP_Label_&lt;GUID&gt;_Name</text>

  <!-- Output Payload Schema Box -->
  <rect x="502" y="560" width="375" height="183" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="690" y="585" text-anchor="middle" fill="#34d399" font-size="13.5" font-weight="700">📦 SDP-Ready MCP Tool Response Schema</text>
  <rect x="518" y="596" width="343" height="134" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="528" y="615" fill="#93c5fd" font-size="10.5" font-family="monospace">{</text>
  <text x="540" y="631" fill="#e2e8f0" font-size="10.5" font-family="monospace">"content": "Extracted Mammoth / XLSX text...",</text>
  <text x="540" y="647" fill="#34d399" font-size="10.5" font-family="monospace">"msip_labels": "MSIP_Label_&lt;guid&gt;_Enabled=True;...",</text>
  <text x="540" y="663" fill="#34d399" font-size="10.5" font-family="monospace">"assigned_labels": [{"labelId": "&lt;guid&gt;", ...}],</text>
  <text x="540" y="679" fill="#34d399" font-size="10.5" font-family="monospace">"assigned_sensitivity_labels": [{"labelId": "&lt;guid&gt;"}],</text>
  <text x="540" y="695" fill="#fbbf24" font-size="10.5" font-family="monospace">"fileLabel": "Sensitivity-Label-Name",</text>
  <text x="540" y="711" fill="#93c5fd" font-size="10.5" font-family="monospace">}</text>

  <!-- ==================== COLUMN 3: MICROSOFT 365 & SHAREPOINT ONLINE ==================== -->
  <rect x="936" y="96" width="415" height="670" rx="14" fill="url(#msftCard)" stroke="#a855f7" stroke-width="2"/>
  <text x="1143" y="128" text-anchor="middle" fill="#c084fc" font-size="16.5" font-weight="700">
    3. Microsoft 365 &amp; Purview Governance
  </text>
  <text x="1143" y="148" text-anchor="middle" fill="#d8b4fe" font-size="12">
    SharePoint Online &amp; Microsoft Purview Information Protection
  </text>

  <!-- Entra ID Box -->
  <rect x="956" y="168" width="375" height="115" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
  <text x="1143" y="194" text-anchor="middle" fill="#c084fc" font-size="14" font-weight="700">🔐 Microsoft Entra ID (OAuth 2.0)</text>
  <text x="974" y="218" fill="#e2e8f0" font-size="11.5">• Dual-Mode Authentication Support:</text>
  <text x="986" y="238" fill="#cbd5e1" font-size="11">1. Delegated User Bearer Token (Forwarded from GE)</text>
  <text x="986" y="256" fill="#cbd5e1" font-size="11">2. Application Client Credentials OAuth 2.0 Fallback</text>
  <text x="974" y="274" fill="#94a3b8" font-size="10.5">Permissions: Sites.ReadWrite.All, Files.ReadWrite.All</text>

  <!-- SharePoint Online Document Library -->
  <rect x="956" y="302" width="375" height="240" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="1143" y="328" text-anchor="middle" fill="#e9d5ff" font-size="14" font-weight="700">📂 SharePoint Online Document Libraries</text>

  <rect x="972" y="346" width="343" height="82" rx="8" fill="#0f172a" stroke="#f87171" stroke-width="1.2"/>
  <text x="986" y="368" fill="#f87171" font-size="12" font-weight="700">📄 Labeled Document (e.g. QuantumLedger.docx)</text>
  <text x="986" y="388" fill="#e2e8f0" font-size="11">• Embedded OOXML Custom Property (docProps/custom.xml):</text>
  <text x="986" y="406" fill="#fbbf24" font-size="10.5" font-family="monospace">MSIP_Label_&lt;GUID&gt;_Enabled = true</text>
  <text x="986" y="421" fill="#94a3b8" font-size="10.5">→ Blocked by GE SDP Connector Policy via SensitivityLabel GUID</text>

  <rect x="972" y="442" width="343" height="82" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="986" y="464" fill="#fbbf24" font-size="12" font-weight="700">📄 Sensitive Content Doc (e.g. Policy_2321.docx)</text>
  <text x="986" y="484" fill="#e2e8f0" font-size="11">• Contains Sensitive Text Pattern (e.g. FAR 2.101 / 3.104):</text>
  <text x="986" y="502" fill="#cbd5e1" font-size="10.5" font-family="monospace">"SOURCE SELECTION INFORMATION — SEE FAR..."</text>
  <text x="986" y="517" fill="#94a3b8" font-size="10.5">→ Blocked by GE SDP Connector Policy via Custom InfoType Regex</text>

  <!-- Purview Label Policy Box -->
  <rect x="956" y="560" width="375" height="183" rx="10" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
  <text x="1143" y="586" text-anchor="middle" fill="#c084fc" font-size="14" font-weight="700">🏷️ Microsoft Purview Information Protection</text>
  <text x="974" y="612" fill="#e2e8f0" font-size="11.5">• Sensitivity Label Taxonomy (GUID &amp; Display Name)</text>
  <text x="974" y="634" fill="#e2e8f0" font-size="11.5">• Stamps MSIP_Label_&lt;GUID&gt; metadata into Office files</text>
  <text x="974" y="656" fill="#e2e8f0" font-size="11.5">• Synced by GUID with Google Cloud SDP InfoType:</text>
  <text x="986" y="678" fill="#34d399" font-size="11" font-family="monospace">SensitivityLabelMetadata.guid == Purview Label ID</text>
  <text x="974" y="704" fill="#94a3b8" font-size="11">• Enables unified cross-cloud DLP governance between</text>
  <text x="986" y="722" fill="#94a3b8" font-size="11">Microsoft Purview and Google Cloud Gemini Enterprise</text>

  <!-- ==================== ARROWS BETWEEN COLUMNS ==================== -->
  <!-- Column 1 <-> Column 2 -->
  <line x1="423" y1="205" x2="498" y2="205" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <text x="462" y="196" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">JSON-RPC</text>

  <line x1="498" y1="620" x2="427" y2="410" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="462" y="535" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">msip_labels</text>

  <!-- Column 2 <-> Column 3 -->
  <line x1="877" y1="220" x2="952" y2="220" stroke="#c084fc" stroke-width="2.2" marker-end="url(#arrowPurple)"/>
  <text x="915" y="210" text-anchor="middle" fill="#d8b4fe" font-size="10" font-weight="600">Graph API</text>

  <line x1="952" y1="430" x2="881" y2="430" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#arrowAmber)"/>
  <text x="915" y="420" text-anchor="middle" fill="#fde68a" font-size="10" font-weight="600">OOXML + Meta</text>
</svg>
