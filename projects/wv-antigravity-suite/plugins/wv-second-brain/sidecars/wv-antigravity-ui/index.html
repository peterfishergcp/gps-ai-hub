<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WV Antigravity</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/preload.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <defs>
            <radialGradient id="hdrTopRed" cx="62%" cy="22%" r="48%">
              <stop offset="0%" stop-color="#FF4B3A"/>
              <stop offset="48%" stop-color="#FF9F1C"/>
              <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="hdrLeftGreen" cx="34%" cy="32%" r="46%">
              <stop offset="0%" stop-color="#34C759"/>
              <stop offset="52%" stop-color="#A3E635" stop-opacity="0.7"/>
              <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="hdrBaseBlue" x1="50" y1="12" x2="50" y2="88" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#60A5FA"/>
              <stop offset="55%" stop-color="#2563EB"/>
              <stop offset="100%" stop-color="#3B82F6"/>
            </linearGradient>
          </defs>
          <path d="M50 13C38.5 13 31.8 29.5 24.5 49.5C18.2 66.8 13.5 76.2 9.8 81.2C7.8 83.9 9.9 87 13.1 86.4C19.8 85.1 26.2 77.6 32.8 66.8C38.5 57.5 43.6 52.5 50 52.5C56.4 52.5 61.5 57.5 67.2 66.8C73.8 77.6 80.2 85.1 86.9 86.4C90.1 87 92.2 83.9 90.2 81.2C86.5 76.2 81.8 66.8 75.5 49.5C68.2 29.5 61.5 13 50 13Z" fill="url(#hdrBaseBlue)"/>
          <path d="M50 13C38.5 13 31.8 29.5 24.5 49.5C18.2 66.8 13.5 76.2 9.8 81.2C7.8 83.9 9.9 87 13.1 86.4C19.8 85.1 26.2 77.6 32.8 66.8C38.5 57.5 43.6 52.5 50 52.5C56.4 52.5 61.5 57.5 67.2 66.8C73.8 77.6 80.2 85.1 86.9 86.4C90.1 87 92.2 83.9 90.2 81.2C86.5 76.2 81.8 66.8 75.5 49.5C68.2 29.5 61.5 13 50 13Z" fill="url(#hdrLeftGreen)"/>
          <path d="M50 13C38.5 13 31.8 29.5 24.5 49.5C18.2 66.8 13.5 76.2 9.8 81.2C7.8 83.9 9.9 87 13.1 86.4C19.8 85.1 26.2 77.6 32.8 66.8C38.5 57.5 43.6 52.5 50 52.5C56.4 52.5 61.5 57.5 67.2 66.8C73.8 77.6 80.2 85.1 86.9 86.4C90.1 87 92.2 83.9 90.2 81.2C86.5 76.2 81.8 66.8 75.5 49.5C68.2 29.5 61.5 13 50 13Z" fill="url(#hdrTopRed)"/>
        </svg>
        <div>
          <div class="brand-title" id="header-title">WV Antigravity</div>
          <div class="brand-sub" id="header-sub"></div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-secondary btn-sm" id="btn-open-skills-ext" type="button" title="Open the dedicated WV Skills sidebar panel">WV Skills ✨</button>
        <button class="btn btn-secondary btn-sm" id="btn-refresh" type="button" title="Reload workspace memory, updates &amp; TokenEconomics">Refresh</button>
        <button class="btn-icon" id="btn-customize" type="button" title="Customize Role, Voice &amp; Memory Files" aria-label="Customize Role, Voice and Memory Files">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="2" y1="14" x2="6" y2="14"></line>
            <line x1="10" y1="8" x2="14" y2="8"></line>
            <line x1="18" y1="16" x2="22" y2="16"></line>
          </svg>
        </button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab-btn active" data-tab="overview" type="button">Overview</button>
      <button class="tab-btn" data-tab="actions" type="button">Action Items</button>
      <button class="tab-btn" data-tab="initiatives" type="button">Initiatives</button>
      <button class="tab-btn" data-tab="contacts" type="button">Stakeholders</button>
      <button class="tab-btn" data-tab="tokens" type="button">TokenEconomics</button>
    </nav>

    <main class="content" id="view-root"></main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/token_pill_ui.js"></script>
  <script src="/tokeneconomics_and_updates_ui.js"></script>
  <script src="/app.js"></script>
</body>
</html>
