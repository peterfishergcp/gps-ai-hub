<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WV Preview — West Virginia Antigravity</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/preload.js"></script>
</head>
<body>
  <header class="preview-header">
    <div class="header-top">
      <div class="brand-row">
        <svg class="brand-logo" width="28" height="28" viewBox="0 0 100 100" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="wvPreviewGrad" x1="14" y1="14" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>
  <circle cx="44" cy="44" r="26" stroke="url(#wvPreviewGrad)" stroke-width="11"/>
  <circle cx="44" cy="44" r="15" fill="#3B82F6" fill-opacity="0.14"/>
  <path d="M34 34C37.5 30.5 42.5 29 47.5 30" stroke="#60A5FA" stroke-width="5" stroke-linecap="round"/>
  <path d="M64 64L85 85" stroke="url(#wvPreviewGrad)" stroke-width="12" stroke-linecap="round"/>
</svg>
        <div>
          <h1>WV Preview</h1>
          <p class="subtitle" id="previewSubtitle">Dashboards, 16:9 Slides &amp; Branded Docs</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-secondary" id="openConvBtn" hidden title="Jump to the conversation that created this deliverable">Open Chat</button>
        <button type="button" class="btn-secondary" id="refreshListBtn" title="Scan conversations &amp; reload visual deliverables">Refresh</button>
        <button type="button" class="btn-secondary" id="printPdfBtn" disabled title="Open in an unsandboxed browser tab to Print or Save as PDF">Print / PDF</button>
        <button type="button" class="btn-secondary" id="saveDownloadsBtn" disabled title="Save standalone .html directly to your Downloads folder">Save HTML</button>
        <button type="button" class="btn-primary" id="openBrowserBtn" disabled title="Open full-screen in an unsandboxed browser tab">Open in Browser ↗</button>
      </div>
    </div>

    <div class="artifact-finder-bar" id="artifactFinderBar" hidden>
      <div class="artifact-picker-wrap">
        <button type="button" class="btn-secondary artifact-picker-btn" id="artifactPickerBtn" aria-expanded="false">
          All Artifacts (0) ▾
        </button>
        <div class="artifact-dropdown" id="artifactDropdown" hidden></div>
      </div>
      <div class="preview-search-box">
        <span class="search-glyph" aria-hidden="true">⌕</span>
        <input type="search" id="artifactSearchInput" placeholder="Search artifacts by title, type, or date..." autocomplete="off">
      </div>
      <select id="artifactSortSelect" class="preview-sort-select" aria-label="Sort deliverables">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="title">Title A–Z</option>
      </select>
    </div>

    <div class="filter-bar" id="kindFilterBar" hidden></div>
    <div class="tabs-bar" id="deliverableTabs" role="tablist" aria-label="Generated design deliverables"></div>
  </header>

  <main class="preview-stage" id="previewStage">
    <div class="empty-state" id="emptyState">
      <h2>No Visual Deliverables Yet</h2>
      <p>Generate an interactive dashboard, 16:9 slide deck, or print-ready flyer in chat and click <strong>Refresh</strong>—or launch one in 1 click below:</p>
      <div class="starter-grid" id="starterGrid"></div>
    </div>
    <iframe id="previewFrame" class="preview-frame" title="Rendered Visual Deliverable Preview" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals allow-popups allow-popups-to-escape-sandbox" hidden></iframe>
  </main>

  <div class="toast" id="statusToast" hidden></div>
  <script src="/token_pill_ui.js"></script>
  <script src="/app.js"></script>
</body>
</html>
